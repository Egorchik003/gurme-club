<!DOCTYPE html>
<html lang="ru">
<head>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta charset="UTF-8">
  <title>ГурмэКлаб — Новое объявление</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <script type="module">
    import { renderHeader } from "./components.js";
    renderHeader();
  </script>

  <div class="container" style="margin: 100px auto 40px auto; max-width: 800px; padding: 0 20px;">
    
    <div class="card">
      <h2>Создать объявление</h2>
      <div id="error" class="error"></div>

      <div class="editor-toolbar">
        <button type="button" onclick="execCmd('bold')" title="Жирный"><b>Ж</b></button>
        <button type="button" onclick="execCmd('italic')" title="Курсив"><i>К</i></button>
        <button type="button" onclick="execCmd('underline')" title="Подчёркнутый"><u>Ч</u></button>
        <button type="button" onclick="execCmd('insertOrderedList')" title="Нумерованный список">1.</button>
<button type="button" onclick="insertLink('ann-content')" title="Вставить ссылку">🔗</button>
        <input type="file" id="ann-image-input" accept="image/*" style="display: none;" onchange="uploadAnnImage()">
<button type="button" onclick="document.getElementById('ann-image-input').click()" title="Картинка">🖼</button>
      </div>

      <input type="text" id="ann-title" placeholder="Заголовок объявления">

      <div id="ann-content" class="rich-editor" contenteditable="true" data-placeholder="Текст объявления..."></div>

      <button onclick="publishAnnouncement()">Опубликовать</button>
      <button class="secondary" onclick="history.back()" style="margin-top: 8px;">Назад</button>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./app.js";
    import { showToast, showLinkModal } from "./ui.js";
    import { onAuthStateChanged, signOut } 
      from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
    import { doc, getDoc, collection, addDoc, serverTimestamp } 
      from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
      import { ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-storage.js";
import { storage } from "./app.js";

    let userData = null;
    let isAdmin = false;

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = "index.html"; return; }

      const snap = await getDoc(doc(db, 'users', user.uid));
      userData = snap.data();
      isAdmin = userData?.role === 'admin';

      if (!isAdmin) {
        showToast('Доступ только для администратора', 'error', 3000);
        setTimeout(() => window.location.href = "feed.html", 1000);
        return;
      }
    });

    window.logout = () => signOut(auth);

    // Форматирование текста
    window.execCmd = (cmd) => {
      document.execCommand(cmd, false, null);
      document.getElementById('ann-content').focus();
    };

window.uploadAnnImage = async () => {
  const fileInput = document.getElementById('ann-image-input');
  const file = fileInput.files[0];
  if (!file) return;

  showToast('Загрузка картинки...', 'info', 2000);
  const storageRef = ref(storage, `announcements/${Date.now()}_${file.name}`);
  
  try {
    await uploadBytes(storageRef, file);
    const downloadURL = await getDownloadURL(storageRef);
    
    document.getElementById('ann-content').focus();
    document.execCommand('insertImage', false, downloadURL);
    
    showToast('Картинка вставлена!', 'success', 1500);
  } catch (error) {
    showToast('Ошибка: ' + error.message, 'error', 5000);
  }
};

    // Публикация
    window.publishAnnouncement = async () => {
      const title = document.getElementById('ann-title').value.trim();
      const content = document.getElementById('ann-content').innerHTML.trim();
      const errorDiv = document.getElementById('error');

      if (!title) { errorDiv.innerText = 'Заполните заголовок'; return; }
      if (!content || content === '<br>') { errorDiv.innerText = 'Заполните текст'; return; }

      try {
        await addDoc(collection(db, "announcements"), {
          title: title,
          content: content,
          author: auth.currentUser.email,
          authorName: userData.name,
          createdAt: serverTimestamp()
        });
        
        showToast('Объявление опубликовано!', 'success', 1500);
        setTimeout(() => window.location.href = 'feed.html?tab=announcements', 800);
      } catch (error) {
        errorDiv.innerText = 'Ошибка: ' + error.message;
      }
    };

window.insertLink = async (editorId) => {
  const editor = document.getElementById(editorId);
  if (!editor) return;

  // Сохраняем текущее выделение/курсор, чтобы не потерять его при открытии окна
  const selection = window.getSelection();
  let savedRange = null;
  let selectedText = '';
  if (selection.rangeCount && editor.contains(selection.anchorNode)) {
    savedRange = selection.getRangeAt(0).cloneRange();
    selectedText = selection.toString();
  }

  const result = await showLinkModal(selectedText);
  if (!result) return;

  editor.focus();
  const a = document.createElement('a');
  a.href = result.url;
  a.textContent = result.text;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';

  if (savedRange) {
    selection.removeAllRanges();
    selection.addRange(savedRange);
    savedRange.deleteContents();
    savedRange.insertNode(a);
    savedRange.setStartAfter(a);
    savedRange.setEndAfter(a);
    selection.removeAllRanges();
    selection.addRange(savedRange);
  } else {
    editor.appendChild(a);
  }
};

  </script>
</body>
</html>
