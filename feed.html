<!DOCTYPE html>
<html lang="ru">
<head>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <title>ГурмэКлаб — Лента</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Подключаем единую шапку и меню -->
  <script type="module">
    import { renderSidebar, renderHeader, renderFooter } from "./components.js";
    renderHeader();
    const urlParams = new URLSearchParams(window.location.search);
    const activeTab = urlParams.get('tab') || 'posts';
    renderSidebar(['messages', 'notifications', 'directory', 'announcements', 'profile'].includes(activeTab) ? activeTab : 'posts');
    renderFooter();
  </script>

  <main class="main-content">
    <!-- ВКЛАДКА: Посты -->
    <div id="tab-posts" class="tab-content active" style="display: block;">
      <!-- Место для строки поиска, она будет создана скриптом -->
      <div id="posts-container"></div>
    </div>

    <!-- ВКЛАДКА: Сообщения -->
    <div id="tab-messages" class="tab-content" style="display: none;">
      <div class="messenger-layout">
        <div class="chat-sidebar" id="chat-sidebar">
          <div class="sidebar-header">Чаты</div>
          <div id="chat-users-list" class="chat-list">
            <p style="color: var(--text-muted); padding: 15px; text-align: center;">Загрузка...</p>
          </div>
        </div>
        <div class="chat-main" id="chat-main">
          <div id="chat-placeholder" class="chat-placeholder">
            <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <p>Выберите чат, чтобы начать общение</p>
          </div>
          <div id="chat-window" style="display: none; flex-direction: column; height: 100%;">
            <div class="chat-header">
              <img id="chat-avatar" src="" class="chat-header-avatar" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%231c2b57\'><circle cx=\'12\' cy=\'12\' r=\'12\'/><path d=\'M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z\' fill=\'%23d4af37\'/></svg>'">
              <div>
                <h3 id="chat-with-name" style="color: var(--text-main); font-size: 18px; margin: 0;"></h3>
                <span id="chat-with-number" style="font-size: 12px; color: var(--gold-main);"></span>
              </div>
            </div>
            <div id="chat-messages" class="chat-messages"></div>
            <div class="chat-input-area">
              <button class="icon-btn" onclick="toggleEmojiPicker()" title="Эмодзи">😊</button>
              <div id="emoji-picker" class="emoji-picker" style="display: none;">
                <span onclick="addEmoji('😀')">😀</span><span onclick="addEmoji('😂')">😂</span><span onclick="addEmoji('❤️')">❤️</span><span onclick="addEmoji('👍')">👍</span><span onclick="addEmoji('🔥')">🔥</span>
              </div>
              <input type="text" id="chat-input" placeholder="Написать сообщение..." onkeypress="handleEnter(event)">
              <button class="icon-btn" onclick="sendMessage()" title="Отправить">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ВКЛАДКА: Уведомления -->
    <div id="tab-notifications" class="tab-content" style="display: none;">
      <div class="card">
        <h2 style="color: var(--gold-main); margin-bottom: 20px;">Уведомления</h2>
        <div id="notification-create-form" style="display: none; margin-bottom: 25px; border-bottom: 1px solid var(--navy-light); padding-bottom: 20px;">
          <input type="text" id="notif-title" placeholder="Заголовок уведомления...">
          <textarea id="notif-text" placeholder="Текст уведомления..."></textarea>
          <button onclick="createNotification()">Отправить всем</button>
        </div>
        <div id="notifications-list"><p style="color: var(--text-muted);">Загрузка...</p></div>
      </div>
    </div>

    <!-- ВКЛАДКА: Справочник -->
    <div id="tab-directory" class="tab-content" style="display: none;">
      
      <!-- Панель категорий -->
      <div class="card" style="margin-bottom: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
          <h2 style="color: var(--gold-main); margin: 0;">Категории</h2>
          <button id="toggle-category-settings-btn" class="secondary" onclick="toggleCategorySettings()" style="display: none; width: auto; padding: 8px 16px; font-size: 13px; margin: 0;">⚙️ Настроить</button>
        </div>

        <!-- Контейнер для кнопок категорий -->
        <div id="categories-bar" style="display: flex; flex-wrap: wrap; gap: 10px;">
          <!-- Кнопки будут генерироваться скриптом -->
        </div>

        <!-- Панель настройки (скрыта по умолчанию) -->
        <div id="category-settings-panel" style="display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border-color);">
          <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <input type="text" id="new-category-name" placeholder="Название новой категории..." style="flex-grow: 1; margin: 0;">
            <button onclick="createCategory()" style="width: auto; margin: 0;">Добавить</button>
          </div>
          <p style="font-size: 13px; color: var(--text-muted);">Для сортировки перетаскивайте категории за иконку <span style="font-size:16px;">⠿</span> (работает только для админа).</p>
        </div>
      </div>

      <!-- Контейнер для постов -->
      <div id="directory-posts-container">
        <p style="color: var(--text-muted); text-align: center; padding: 20px;">Загрузка постов...</p>
      </div>
    </div>

    <!-- ВКЛАДКА: Объявления -->
    <div id="tab-announcements" class="tab-content" style="display: none;">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h2 style="color: var(--gold-main); margin: 0;">Объявления</h2>
          <button id="create-announcement-btn" class="secondary" onclick="location.href='create-announcement.html'" style="display: none; width: auto; margin: 0; padding: 8px 16px; font-size: 13px;">Создать объявление</button>
        </div>
        <div id="announcements-container"><p style="color: var(--text-muted); text-align: center;">Загрузка...</p></div>
      </div>
    </div>

    <!-- ВКЛАДКА: Профиль -->
    <div id="tab-profile" class="tab-content" style="display: none;">
      <div class="card">
        <h2 style="color: var(--gold-main); margin-bottom: 20px;">Мой профиль</h2>
        <div style="display: flex; gap: 20px; align-items: flex-start; margin-bottom: 25px; flex-wrap: wrap;">
          
          <!-- Аватарка (кликабельная) -->
          <div onclick="document.getElementById('avatar-file-input').click()" style="width: 100px; height: 100px; border-radius: 50%; background: var(--navy-light); border: 2px solid var(--gold-main); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; cursor: pointer; transition: 0.2s;" onmouseover="this.style.borderColor='#fff'" onmouseout="this.style.borderColor='var(--gold-main)'" title="Нажмите, чтобы изменить аватарку">
            <img id="profile-avatar-img" src="" style="width: 100%; height: 100%; object-fit: cover; display: none;">
            <span id="profile-avatar-placeholder" style="font-size: 40px; color: var(--gold-main);">👤</span>
          </div>
          
          <!-- Скрытый input для файла -->
          <input type="file" id="avatar-file-input" accept="image/*" style="display: none;" onchange="uploadAvatar()">

          <!-- Информация о пользователе -->
          <div style="flex-grow: 1; min-width: 250px;">
            
            <!-- Поле для изменения Имени -->
            <label style="display: block; margin-bottom: 5px; font-size: 14px; color: var(--text-muted);">Имя</label>
            <input type="text" id="profile-name-input" placeholder="Ваше имя" style="margin-bottom: 15px; width: 100%;">

            <p id="profile-email" style="color: var(--text-muted); font-size: 14px; margin-bottom: 5px;"></p>
            <p id="profile-number" style="color: var(--gold-dark); font-size: 14px; font-weight: bold; margin-bottom: 15px;"></p>
            
            <!-- Смена роли (Только для админа) -->
            <div id="role-select-wrapper" style="display: none; margin-bottom: 15px;">
              <label style="display: block; margin-bottom: 5px; font-size: 14px; color: var(--danger);">Роль (только для админа)</label>
              <select id="profile-role-select">
                <option value="user">Пользователь</option>
                <option value="admin">Администратор</option>
              </select>
            </div>

            <p style="font-size: 12px; color: var(--text-muted);">Нажмите на аватарку, чтобы изменить её</p>
          </div>
        </div>
        
        <label style="display: block; margin-bottom: 5px; font-size: 14px; color: var(--text-muted);">О себе (Био)</label>
        <textarea id="profile-bio" placeholder="Расскажите о себе..." style="min-height: 100px; margin-bottom: 20px;"></textarea>
        
        <button onclick="saveProfile()">Сохранить профиль</button>
      </div>
    </div>
  </main>

  <script type="module">
    import { auth, db } from "./app.js";
    import { showToast, showConfirm } from "./ui.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
    import { collection, doc, getDoc, getDocs, query, orderBy, where, onSnapshot, addDoc, serverTimestamp, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
    import { ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-storage.js";
    import { storage } from "./app.js";

    window.logout = () => signOut(auth);

    let currentUser = null;
    let currentUserData = null;
    let isAdmin = false;
    let currentChatId = null;
    let unsubscribeChat = null;
    let allPosts = [];

    window.switchTab = (tabName, btnElement, saveToMemory = true) => {
      if (saveToMemory) localStorage.setItem('activeTab', tabName);
      
      // 1. Прячем все вкладки
      document.querySelectorAll('.tab-content').forEach(tab => {
        tab.classList.remove('active');
        tab.style.display = 'none';
      });
      
      // 2. Показываем нужную вкладку
      const targetTab = document.getElementById(`tab-${tabName}`);
      if (targetTab) {
        targetTab.classList.add('active');
        targetTab.style.display = 'block';
      }
      
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');

      // 3. ЛОГИКА ПОИСКА: Создаем или удаляем его
      const postsTab = document.getElementById('tab-posts');
      let searchWrapper = document.getElementById('search-wrapper');

      if (tabName === 'posts') {
        if (!searchWrapper) {
          searchWrapper = document.createElement('div');
          searchWrapper.id = 'search-wrapper';
          searchWrapper.style.marginBottom = '20px';
          searchWrapper.innerHTML = `
            <input type="text" id="search-input" placeholder="Поиск по заголовку поста..." oninput="filterPosts()" style="width: 100%; padding: 12px 16px; border-radius: 8px; background: var(--bg-input); border: 1px solid var(--navy-light); color: var(--text-main); box-sizing: border-box;">
          `;
          postsTab.insertBefore(searchWrapper, postsTab.firstChild);
        }
        setTimeout(() => window.loadPosts(), 50);
      } else {
        if (searchWrapper) {
          searchWrapper.remove();
        }
      }

      // 4. Загружаем данные
      if (tabName === 'profile') loadProfileData();
      if (tabName === 'directory') initDirectory();
      if (tabName === 'notifications') loadNotifications();
      if (tabName === 'messages') loadMessages();
      if (tabName === 'announcements') loadAnnouncements();
    };

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = "index.html"; return; }
      currentUser = user;
      
      const userSnap = await getDoc(doc(db, "users", user.uid));
      currentUserData = userSnap.data() || { name: user.email, role: "user" };
      isAdmin = currentUserData.role === "admin";

      const numberHtml = currentUserData.number ? ` <span class="post-number">№${currentUserData.number}</span>` : '';
      const userInfoEl = document.getElementById('user-info');
      if (userInfoEl) {
        userInfoEl.innerHTML = `${currentUserData.name}${numberHtml}` + (isAdmin ? ' <span class="badge admin">ADMIN</span>' : ' <span class="badge user">USER</span>');
      }
      
      if (isAdmin) {
        const createBtn = document.getElementById('create-btn');
        if (createBtn) createBtn.style.display = 'inline-block';
      const createPostBtn = document.getElementById('create-post-btn');
        if (createPostBtn) createPostBtn.style.display = 'flex'; // или 'inline-block'
      }

      let tabFromUrl = new URLSearchParams(window.location.search).get('tab');
      if (tabFromUrl) {
        switchTab(tabFromUrl, null, false);
      } else {
        // Если параметра нет, ВСЕГДА открываем 'posts', игнорируя localStorage
        switchTab('posts', null, false); 
      }
    });

    // === ПОИСК И ВЫВОД ПОСТОВ ===
    window.loadPosts = function() {
      const container = document.getElementById('posts-container');
      if (!container) return;
      let q = isAdmin ? query(collection(db, "posts"), orderBy("createdAt", "desc")) : query(collection(db, "posts"), where("isOpen", "==", true), orderBy("createdAt", "desc"));
      onSnapshot(q, (snapshot) => {
        allPosts = [];
        snapshot.forEach((docSnap) => { allPosts.push({ id: docSnap.id, data: docSnap.data() }); });
        renderFilteredPosts();
      }, (error) => { container.innerHTML = '<div class="card" style="text-align:center;color:#dc2626;">Ошибка: ' + error.message + '</div>'; });
    }

    window.filterPosts = () => { renderFilteredPosts(); }

    function renderFilteredPosts() {
      const container = document.getElementById('posts-container');
      if (!container) return;
      
      // Показываем скелетоны, пока идет поиск/фильтрация
      container.innerHTML = `
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      `;

      const searchInput = document.getElementById('search-input');
      const searchText = searchInput ? searchInput.value.toLowerCase() : '';
      
      const filtered = allPosts.filter(p => (p.data.title || '').toLowerCase().includes(searchText));
      
      // Небольшая задержка, чтобы скелетоны успели мелькнуть (для красоты, можно убрать)
      setTimeout(() => {
        container.innerHTML = '';
        
        if (filtered.length === 0) {
          container.innerHTML = '<div class="card" style="text-align:center;color:#94a3b8;">Посты не найдены</div>';
          return;
        }
        
        filtered.forEach((post) => renderPost(post.id, post.data, container));
      }, 300); // Задержка 300мс
    }

    function renderPost(postId, post, container) {
      const div = document.createElement('div');
      div.className = 'card';
      div.innerHTML = `
        <div><span class="post-author">${escapeHtml(post.authorName || post.author)}</span> ${post.isOpen === false ? '<span class="badge closed">ЗАКРЫТ</span>' : ''}</div>
        <div class="post-title" style="cursor: pointer;" onclick="location.href='post.html?id=${postId}'">${escapeHtml(post.title)}</div>
        <div class="post-content" style="cursor: pointer;" onclick="location.href='post.html?id=${postId}'">${linkify(escapeHtml(post.content.substring(0, 150)))}...</div>
        <div class="post-time">${post.createdAt ? new Date(post.createdAt.seconds * 1000).toLocaleString() : ''}</div>
      `;
      container.appendChild(div);
    }

    // === ПРОФИЛЬ ===
    async function loadProfileData() {
      if (!currentUserData) return;
      
      const nameInput = document.getElementById('profile-name-input');
      if (nameInput) nameInput.value = currentUserData.name || '';
      
      const emailEl = document.getElementById('profile-email');
      if (emailEl) emailEl.innerText = currentUserData.email || '';
      
      const numEl = document.getElementById('profile-number');
      if (numEl) numEl.innerText = currentUserData.number ? `ID аккаунта: №${currentUserData.number}` : `ID аккаунта: (нет)`;
      
      const bioEl = document.getElementById('profile-bio');
      if (bioEl) bioEl.value = currentUserData.bio || '';

      // Аватарка
      if (currentUserData.avatarUrl) {
        const img = document.getElementById('profile-avatar-img');
        if (img) {
          img.src = currentUserData.avatarUrl; img.style.display = 'block';
          document.getElementById('profile-avatar-placeholder').style.display = 'none';
        }
      } else {
        const img = document.getElementById('profile-avatar-img');
        if (img) img.style.display = 'none';
        document.getElementById('profile-avatar-placeholder').style.display = 'block';
      }

      // Роль (только для админа)
      if (isAdmin) {
        const roleWrapper = document.getElementById('role-select-wrapper');
        if (roleWrapper) roleWrapper.style.display = 'block';
        const roleSelect = document.getElementById('profile-role-select');
        if (roleSelect) roleSelect.value = currentUserData.role || 'user';
      }
    }

    window.saveProfile = async () => {
      const nameInput = document.getElementById('profile-name-input');
      const newName = nameInput ? nameInput.value.trim() : '';
      const bio = document.getElementById('profile-bio').value.trim();
      
      if (!newName) {
        showToast('Имя не может быть пустым', 'error', 3000);
        return;
      }

      try {
        const updateData = { bio, name: newName };
        
        // Если админ — меняем роль
        if (isAdmin) {
          const roleSelect = document.getElementById('profile-role-select');
          if (roleSelect) updateData.role = roleSelect.value;
        }

        await updateDoc(doc(db, "users", currentUser.uid), updateData);
        
        // Обновляем локальные данные
        currentUserData.bio = bio;
        currentUserData.name = newName;
        if (updateData.role) currentUserData.role = updateData.role;

        // Обновляем шапку
        const userInfoEl = document.getElementById('user-info');
        if (userInfoEl) {
          const numberHtml = currentUserData.number ? ` <span class="post-number">№${currentUserData.number}</span>` : '';
          userInfoEl.innerHTML = `${newName}${numberHtml}` + (isAdmin ? ' <span class="badge admin">ADMIN</span>' : ' <span class="badge user">USER</span>');
        }

        showToast('Профиль сохранён!', 'success', 2000);
      } catch (error) { 
        showToast('Ошибка: ' + error.message, 'error', 5000); 
      }
    };

    window.uploadAvatar = async () => {
      const fileInput = document.getElementById('avatar-file-input');
      const file = fileInput.files[0];
      if (!file) return;

      showToast('Загрузка аватарки...', 'info', 2000);
      
      try {
        if (!currentUser || !currentUser.uid) {
          throw new Error("Пользователь не авторизован");
        }

        const storageRef = ref(storage, `avatars/${currentUser.uid}`);
        await uploadBytes(storageRef, file);
        const downloadURL = await getDownloadURL(storageRef);

        await updateDoc(doc(db, "users", currentUser.uid), { avatarUrl: downloadURL });
        
        currentUserData.avatarUrl = downloadURL;
        const img = document.getElementById('profile-avatar-img');
        img.src = downloadURL; 
        img.style.display = 'block';
        document.getElementById('profile-avatar-placeholder').style.display = 'none';
        
        showToast('Аватарка обновлена!', 'success', 2000);
      } catch (error) {
        console.error("ОШИБКА ПРИ ЗАГРУЗКЕ:", error);
        showToast('Ошибка: ' + error.message, 'error', 5000);
      }
    };

    // === СПРАВОЧНИК (КАТЕГОРИИ + ПОСТЫ) ===
    let currentCategoryId = null;
    let unsubscribeDirectoryPosts = null;

    function initDirectory() {
      const settingsBtn = document.getElementById('toggle-category-settings-btn');
      if (settingsBtn) settingsBtn.style.display = isAdmin ? 'inline-block' : 'none';
      
      loadCategoriesForDirectory();
      loadDirectoryPosts(); 
    }

    function loadCategoriesForDirectory() {
      const bar = document.getElementById('categories-bar');
      if (!bar) return;
      
      bar.innerHTML = '';

      const allBtn = document.createElement('button');
      allBtn.className = 'secondary';
      allBtn.style.cssText = 'width: auto; margin: 0; border-radius: 20px; font-size: 14px;';
      if (currentCategoryId === null) allBtn.style.backgroundColor = 'var(--gold-main)', allBtn.style.color = '#000';
      allBtn.innerText = 'Все категории';
      allBtn.onclick = () => { currentCategoryId = null; updateCategoryButtons(); loadDirectoryPosts(); };
      bar.appendChild(allBtn);

      onSnapshot(query(collection(db, "categories"), orderBy("createdAt", "asc")), (snapshot) => {
        snapshot.forEach((docSnap) => {
          const cat = docSnap.data();
          const wrapper = document.createElement('div');
          wrapper.style.cssText = 'display: flex; align-items: center; gap: 5px;';

          const btn = document.createElement('button');
          btn.className = 'secondary';
          btn.dataset.id = docSnap.id;
          btn.style.cssText = 'width: auto; margin: 0; border-radius: 20px; font-size: 14px;';
          btn.innerText = cat.name;
          btn.onclick = () => { currentCategoryId = docSnap.id; updateCategoryButtons(); loadDirectoryPosts(); };
          wrapper.appendChild(btn);

          if (isAdmin) {
            const delBtn = document.createElement('button');
            delBtn.className = 'danger';
            delBtn.style.cssText = 'width: auto; padding: 4px 8px; margin: 0; border-radius: 50%; display: none;'; 
            delBtn.innerHTML = '×';
            delBtn.onclick = () => deleteCategory(docSnap.id, cat.name);
            wrapper.appendChild(delBtn);
          }
          bar.appendChild(wrapper);
        });
        updateCategoryButtons(); 
      });
    }

    function updateCategoryButtons() {
      const allBtns = document.querySelectorAll('#categories-bar button');
      allBtns.forEach(btn => {
        btn.style.backgroundColor = 'transparent';
        btn.style.color = 'var(--text-main)';
        if (btn.dataset.id === currentCategoryId || (btn.innerText === 'Все категории' && currentCategoryId === null)) {
          btn.style.backgroundColor = 'var(--gold-main)';
          btn.style.color = '#000';
        }
      });
    }

    function loadDirectoryPosts() {
      const container = document.getElementById('directory-posts-container');
      if (!container) return;
      
      if (unsubscribeDirectoryPosts) unsubscribeDirectoryPosts();
      container.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 20px;">Загрузка...</p>';

      let q;
      if (currentCategoryId) {
        q = query(collection(db, "posts"), where("categoryId", "==", currentCategoryId), orderBy("createdAt", "desc"));
      } else {
        q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
      }

      unsubscribeDirectoryPosts = onSnapshot(q, (snapshot) => {
        container.innerHTML = '';
        if (snapshot.empty) {
          container.innerHTML = '<div class="card" style="text-align:center;color:#94a3b8;">В этой категории пока нет постов.</div>';
          return;
        }
        snapshot.forEach((docSnap) => {
          const post = docSnap.data();
          if (post.isOpen === false && !isAdmin) return; 
          renderDirectoryPost(docSnap.id, post, container);
        });
      });
    }

    function renderDirectoryPost(postId, post, container) {
      const div = document.createElement('div');
      div.className = 'card';
      div.innerHTML = `
        <div><span class="post-author">${escapeHtml(post.authorName || post.author)}</span> ${post.isOpen === false ? '<span class="badge closed">ЗАКРЫТ</span>' : ''}</div>
        <div class="post-title" style="cursor: pointer;" onclick="location.href='post.html?id=${postId}'">${escapeHtml(post.title)}</div>
        <div class="post-content" style="cursor: pointer;" onclick="location.href='post.html?id=${postId}'">${linkify(escapeHtml(post.content.substring(0, 150)))}...</div>
        <div class="post-time">${post.createdAt ? new Date(post.createdAt.seconds * 1000).toLocaleString() : ''}</div>
      `;
      container.appendChild(div);
    }

    window.toggleCategorySettings = () => {
      const panel = document.getElementById('category-settings-panel');
      const delBtns = document.querySelectorAll('#categories-bar .danger');
      
      if (panel.style.display === 'none' || !panel.style.display) {
        panel.style.display = 'block';
        delBtns.forEach(btn => btn.style.display = 'block'); 
      } else {
        panel.style.display = 'none';
        delBtns.forEach(btn => btn.style.display = 'none'); 
      }
    };

    window.createCategory = async () => {
      const input = document.getElementById('new-category-name'); const name = input.value.trim();
      if (!name) return showToast('Введите название категории', 'error', 2000);
      try { 
        await addDoc(collection(db, "categories"), { name, author: currentUserData.name, createdAt: serverTimestamp() }); 
        input.value = ''; 
        showToast('Категория создана!', 'success', 2000); 
      } catch (error) { showToast('Ошибка: ' + error.message, 'error', 5000); }
    };

    window.deleteCategory = async (categoryId, categoryName) => {
      if (!await showConfirm('Удалить категорию?', `Вы уверены, что хотите удалить "${categoryName}"?`, 'Удалить')) return;
      try { 
        await deleteDoc(doc(db, "categories", categoryId)); 
        if (currentCategoryId === categoryId) {
          currentCategoryId = null;
          loadDirectoryPosts();
        }
        showToast('Категория удалена', 'success', 2000); 
      } catch (error) { showToast('Ошибка: ' + error.message, 'error', 5000); }
    };

    // === УВЕДОМЛЕНИЯ ===
    function loadNotifications() {
      const list = document.getElementById('notifications-list');
      if (!list) return;
      onSnapshot(query(collection(db, "notifications"), orderBy("createdAt", "desc")), (snapshot) => {
        list.innerHTML = '';
        const form = document.getElementById('notification-create-form');
        if (form) form.style.display = isAdmin ? 'block' : 'none';
        if (snapshot.empty) { list.innerHTML = '<p style="color: var(--text-muted);">Пока нет уведомлений.</p>'; return; }
        
        snapshot.forEach((docSnap) => {
          const notif = docSnap.data(); 
          const notifId = docSnap.id;
          const date = notif.createdAt ? new Date(notif.createdAt.seconds * 1000).toLocaleString() : '';
          
          const div = document.createElement('div'); 
          div.className = 'comment'; 
          div.style.cssText = 'margin-bottom: 15px; border-left: 4px solid var(--gold-main); position: relative;';
          
          // Кнопка удаления только для админа
          const deleteBtn = isAdmin ? `
            <button class="icon-btn danger-icon" onclick="deleteNotification('${notifId}')" style="position: absolute; top: 10px; right: 10px; width: auto; padding: 5px;" title="Удалить">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
          ` : '';

          div.innerHTML = `
            ${deleteBtn}
            <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 5px;">${date}</div>
            <h4 style="color: var(--gold-main); margin-bottom: 5px; padding-right: 30px;">${escapeHtml(notif.title)}</h4>
            <p style="color: var(--text-main);">${escapeHtml(notif.text)}</p>
          `;
          list.appendChild(div);
        });
      });
    }

    window.createNotification = async () => {
      const title = document.getElementById('notif-title').value.trim(); const text = document.getElementById('notif-text').value.trim();
      if (!title || !text) return showToast('Заполните заголовок и текст', 'error', 2000);
      try { await addDoc(collection(db, "notifications"), { title, text, author: currentUserData.name, createdAt: serverTimestamp() }); document.getElementById('notif-title').value = ''; document.getElementById('notif-text').value = ''; showToast('Уведомление отправлено!', 'success', 2000); } catch (error) { showToast('Ошибка: ' + error.message, 'error', 5000); }
    };

        window.deleteNotification = async (notifId) => {
      const isConfirmed = await showConfirm('Удалить уведомление?', 'Это действие нельзя отменить.', 'Удалить');
      if (!isConfirmed) return;

      try {
        await deleteDoc(doc(db, "notifications", notifId));
        showToast('Уведомление удалено', 'success', 2000);
      } catch (error) {
        showToast('Ошибка: ' + error.message, 'error', 5000);
      }
    };

    // === ОБЪЯВЛЕНИЯ ===
    function loadAnnouncements() {
      const container = document.getElementById('announcements-container');
      if (!container) return;
      const btn = document.getElementById('create-announcement-btn');
      if (btn) btn.style.display = isAdmin ? 'block' : 'none';
      onSnapshot(query(collection(db, "announcements"), orderBy("createdAt", "desc")), (snapshot) => {
        container.innerHTML = '';
        if (snapshot.empty) { container.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 20px;">Пока нет объявлений.</p>'; return; }
        snapshot.forEach((docSnap) => {
          const ann = docSnap.data(); const annId = docSnap.id;
          const div = document.createElement('div'); div.className = 'card'; div.style.cssText = 'background: rgba(0,0,0,0.2); margin-bottom: 15px; border-left: 4px solid var(--gold-main);';
          div.innerHTML = `<div class="post-title" style="font-size: 20px; margin-bottom: 10px; cursor: pointer; text-decoration: underline;" onclick="location.href='announcement.html?id=${annId}'">${escapeHtml(ann.title)}</div><div class="post-content" style="cursor: pointer;" onclick="location.href='announcement.html?id=${annId}'">${linkify(escapeHtml(ann.content)).substring(0, 150)}...</div><div class="post-time">${ann.createdAt ? new Date(ann.createdAt.seconds * 1000).toLocaleString() : ''}</div>`;
          container.appendChild(div);
        });
      });
    }

    // === СООБЩЕНИЯ ===
    async function loadChatUsers() {
      const list = document.getElementById('chat-users-list'); if (!list) return; list.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding:15px;">Загрузка...</p>';
      try {
        let usersSnapshot = isAdmin ? await getDocs(query(collection(db, "users"), where("role", "==", "user"))) : { empty: false, docs: [{ id: currentUser.uid, data: () => currentUserData }] };
        list.innerHTML = '';
        if (usersSnapshot.empty) { list.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding:15px;">Нет чатов</p>'; return; }
        for (const docSnap of usersSnapshot.docs) {
          const user = docSnap.data(); const userId = docSnap.id;
          const lastMsgSnap = await getDocs(query(collection(db, "chats", userId, "messages"), orderBy("createdAt", "desc")));
          let lastMsgText = lastMsgSnap.empty ? "Нет сообщений" : (lastMsgSnap.docs[0].data().senderId === currentUser.uid ? "Вы: " : "") + lastMsgSnap.docs[0].data().text;
          const item = document.createElement('div'); item.className = 'chat-list-item';
          const avatarSrc = user.avatarUrl || 'data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%231c2b57\'><circle cx=\'12\' cy=\'12\' r=\'12\'/><path d=\'M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z\' fill=\'%23d4af37\'/></svg>';
          item.innerHTML = `<img src="${avatarSrc}" class="chat-list-avatar"><div class="chat-list-info"><div class="chat-list-name">${escapeHtml(user.name)} <span class="chat-list-number">№${user.number || '---'}</span></div><div class="chat-list-last-msg">${escapeHtml(lastMsgText)}</div></div>`;
          item.onclick = () => { document.querySelectorAll('.chat-list-item').forEach(el => el.classList.remove('active')); item.classList.add('active'); openChat(userId, user.name, user.number, user.avatarUrl); };
          list.appendChild(item);
        }
      } catch (e) { list.innerHTML = '<p style="color: var(--danger); text-align:center; padding:15px;">Ошибка загрузки</p>'; }
    }

    function loadChatMessages() {
      const msgContainer = document.getElementById('chat-messages'); if (!msgContainer) return;
      if (unsubscribeChat) unsubscribeChat();
      unsubscribeChat = onSnapshot(query(collection(db, "chats", currentChatId, "messages"), orderBy("createdAt", "asc")), (snapshot) => {
        msgContainer.innerHTML = '';
        if (snapshot.empty) { msgContainer.innerHTML = '<div style="text-align:center; color:var(--text-muted); font-size:13px; margin-top:20px;">История сообщений пуста</div>'; return; }
        snapshot.forEach((docSnap) => {
          const msg = docSnap.data(); const isMyMsg = msg.senderId === currentUser.uid;
          const bubble = document.createElement('div'); bubble.className = `chat-bubble ${isMyMsg ? 'my-msg' : 'their-msg'}`;
          const time = msg.createdAt ? new Date(msg.createdAt.seconds * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';
          bubble.innerHTML = `<div>${escapeHtml(msg.text)}</div><span class="chat-time">${time}</span>`;
          msgContainer.appendChild(bubble);
        });
        msgContainer.scrollTop = msgContainer.scrollHeight;
      });
    }

    function openChat(userId, userName, userNumber, userAvatarUrl) {
      currentChatId = userId;
      document.getElementById('chat-placeholder').style.display = 'none';
      document.getElementById('chat-window').style.display = 'flex';
      document.getElementById('chat-with-name').innerText = userName;
      document.getElementById('chat-with-number').innerText = `№${userNumber || '---'}`;
      document.getElementById('chat-avatar').src = userAvatarUrl || 'data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%231c2b57\'><circle cx=\'12\' cy=\'12\' r=\'12\'/><path d=\'M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z\' fill=\'%23d4af37\'/></svg>';
      document.getElementById('chat-input').value = '';
      loadChatMessages();
    }

    function loadMessages() {
      if (isAdmin) loadChatUsers();
      else if (!currentChatId) { openChat(currentUser.uid, currentUserData.name, currentUserData.number, currentUserData.avatarUrl); loadChatUsers(); }
    }

    window.sendMessage = async () => {
      const input = document.getElementById('chat-input'); const text = input.value.trim();
      if (!text || !currentChatId) return;
      try { await addDoc(collection(db, "chats", currentChatId, "messages"), { text, senderId: currentUser.uid, senderName: currentUserData.name, createdAt: serverTimestamp() }); input.value = ''; } catch (error) { showToast('Ошибка: ' + error.message, 'error', 5000); }
    };

    window.toggleEmojiPicker = () => { const picker = document.getElementById('emoji-picker'); picker.style.display = picker.style.display === 'none' ? 'flex' : 'none'; };
    window.addEmoji = (emoji) => { document.getElementById('chat-input').value += emoji; document.getElementById('chat-input').focus(); toggleEmojiPicker(); };
    window.handleEnter = (e) => { if (e.key === 'Enter') sendMessage(); };

    function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, m => ({'&': '&amp;','<': '&lt;','>': '&gt;','"': '&quot;',"'": '&#39;'}[m])); }
        // Превращает ссылки в кликабельные
    function linkify(text) {
      // Регулярное выражение для поиска URL (http, https, www)
      const urlRegex = /(https?:\/\/[^\s]+|www\.[^\s]+)/g;
      return text.replace(urlRegex, function(url) {
        let href = url;
        if (url.startsWith('www.')) {
          href = 'https://' + url;
        }
        // Возвращаем ссылку, открывающуюся в новой вкладке
        return `<a href="${href}" target="_blank" rel="noopener noreferrer" style="color: var(--gold-main); text-decoration: underline;">${url}</a>`;
      });
    }
  </script>
</body>
</html>
