<!DOCTYPE html>
<html lang="ru">
<head>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <title>ГурмэКлаб — Главная</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Подключаем единую шапку и меню -->
  <script type="module">
    import { renderSidebar, renderHeader, renderFooter} from "./components.js";
    renderHeader();
    renderSidebar('home');
    renderFooter();
  </script>

  <main class="main-content">
    <div class="header" style="margin-bottom: 30px;">
      <div>
        <h1 id="greeting" style="font-size: 32px; color: #fff;">Добрый день!</h1>
        <p id="current-date" style="color: var(--text-muted);">Сегодня...</p>
        <div class="card home-ann-card">
      <div class="home-ann-header">
        <div class="home-ann-title-group">
          <span class="home-ann-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 17H2a3 3 0 0 0 3-3V9a7 7 0 0 1 14 0v5a3 3 0 0 0 3 3zm-8.27 4a2 2 0 0 1-3.46 0"></path>
            </svg>
          </span>
          <h3>Объявления</h3>
        </div>
        <a href="feed.html?tab=announcements" class="home-ann-all-link">Все объявления →</a>
      </div>

      <div id="latest-announcements" class="home-ann-list">
        <p style="color: var(--text-muted); font-size: 14px;">Загрузка...</p>
      </div>
    </div>
      </div>
    </div>

  <script type="module">
    import { auth, db } from "./app.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
    import { doc, getDoc, collection, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    window.logout = () => signOut(auth);

    const hour = new Date().getHours();
    let greeting = "Добрый день!";
    if (hour < 6) greeting = "Доброй ночи!";
    else if (hour < 12) greeting = "Доброе утро!";
    else if (hour < 18) greeting = "Добрый день!";
    else greeting = "Добрый вечер!";
    
    const greetingEl = document.getElementById('greeting');
    if (greetingEl) greetingEl.innerText = greeting;
    
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    const dateEl = document.getElementById('current-date');
    if (dateEl) dateEl.innerText = new Date().toLocaleDateString('ru-RU', options);

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = "index.html"; return; }

      const userSnap = await getDoc(doc(db, "users", user.uid));
      const userData = userSnap.data() || { name: user.email, role: "user" };
      const isAdmin = userData.role === "admin";

      const numberHtml = userData.number ? ` <span class="post-number">№${userData.number}</span>` : '';
      const userInfoEl = document.getElementById('user-info');
      if (userInfoEl) {
        userInfoEl.innerHTML = `${userData.name}${numberHtml}` + (isAdmin ? ' <span class="badge admin">ADMIN</span>' : ' <span class="badge user">USER</span>');
              if (isAdmin) {
        const createBtn = document.getElementById('create-btn');
        if (createBtn) createBtn.style.display = 'inline-block';
      const createPostBtn = document.getElementById('create-post-btn');
        if (createPostBtn) createPostBtn.style.display = 'flex'; // или 'inline-block'
      }
      }

      loadLatestPosts(isAdmin);
      loadLatestAnnouncements();
    });

    function loadLatestPosts(isAdmin) {
      const container = document.getElementById('latest-posts');
      if (!container) return;
      const q = query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(3));
      
      onSnapshot(q, (snapshot) => {
        container.innerHTML = '';
        if (snapshot.empty) { container.innerHTML = '<p style="color: var(--text-muted);">Пока нет постов.</p>'; return; }
        snapshot.forEach(docSnap => {
          const post = docSnap.data();
          if (post.isOpen === false && !isAdmin) return;
          const a = document.createElement('a');
          a.href = `post.html?id=${docSnap.id}`;
          a.style.cssText = "display: block; padding: 10px; border-bottom: 1px solid var(--border-color); text-decoration: none; color: inherit;";
          a.innerHTML = `<div style="font-weight: bold; color: var(--text-main); margin-bottom: 4px;">${post.title}</div><div style="font-size: 12px; color: var(--text-muted);">${post.authorName || post.author}</div>`;
          container.appendChild(a);
        });
      });
    }

function loadLatestAnnouncements() {
      const container = document.getElementById('latest-announcements');
      if (!container) return;
      const q = query(collection(db, "announcements"), orderBy("createdAt", "desc"), limit(3));

      onSnapshot(q, (snapshot) => {
        container.innerHTML = '';
        if (snapshot.empty) {
          container.innerHTML = `
            <a href="feed.html?tab=announcements" class="home-ann-item">
              <div class="home-ann-item-title" style="color: var(--text-muted);">Пока нет объявлений</div>
              <div class="home-ann-item-meta">Перейти в раздел →</div>
            </a>`;
          return;
        }

        snapshot.forEach(docSnap => {
          const ann = docSnap.data();
          const date = ann.createdAt?.seconds
            ? new Date(ann.createdAt.seconds * 1000).toLocaleDateString('ru-RU')
            : '';

          const a = document.createElement('a');
          a.href = `announcement.html?id=${docSnap.id}`;
          a.className = 'home-ann-item';

          const titleDiv = document.createElement('div');
          titleDiv.className = 'home-ann-item-title';
          titleDiv.textContent = ann.title || 'Без заголовка';

          const metaDiv = document.createElement('div');
          metaDiv.className = 'home-ann-item-meta';
          metaDiv.textContent = [ann.authorName || ann.author, date].filter(Boolean).join(' • ');

          a.appendChild(titleDiv);
          a.appendChild(metaDiv);
          container.appendChild(a);
        });
      });
    }
  </script>
</body>
</html>
