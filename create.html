<!DOCTYPE html>
<html lang="ru">
<head>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta charset="UTF-8">
  <title>ГурмэКлаб — Новый пост</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <script type="module">
    import { renderHeader } from "./components.js";
    renderHeader();
  </script>

  <div class="container" style="max-width: 800px; margin: 80px auto; padding: 0 20px;">

    <div class="card">
      <h2>Создать пост</h2>

      <input type="text" id="post-title" placeholder="Заголовок">
<select id="post-category" style="margin-bottom: 10px;">
  <option value="">Без категории</option>
</select>
      <div class="editor-toolbar">
  <button type="button" onclick="execCmd('bold')" title="Жирный"><b>Ж</b></button>
  <button type="button" onclick="execCmd('italic')" title="Курсив"><i>К</i></button>
  <button type="button" onclick="execCmd('underline')" title="Подчёркнутый"><u>Ч</u></button>
  <button type="button" onclick="execCmd('strikeThrough')" title="Зачёркнутый"><s>З</s></button>
  <input type="file" id="post-image-input" accept="image/*" style="display: none;" onchange="uploadPostImage()">
<button type="button" onclick="document.getElementById('post-image-input').click()" title="Картинка">🖼</button>
</div>

<div id="post-content" class="rich-editor" contenteditable="true" data-placeholder="Содержание поста"></div>

      <label style="display:flex; align-items:center; gap:8px; margin:10px 0; font-weight:600;">
        <input type="checkbox" id="post-open" checked style="width:auto;">
        Открыть пост для всех (если снять — увидят только админы)
      </label>

      <button onclick="publishPost()">Опубликовать</button>
      <button class="secondary" onclick="location.href='home.html'" style="margin-top:8px;">Назад</button>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./app.js";
    import { onAuthStateChanged } 
      from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import { doc, getDoc, updateDoc, collection, addDoc, serverTimestamp, getDocs, query, orderBy } 
  from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
import { showToast, showConfirm, initFlowers } from "./ui.js";
import { ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-storage.js";
import { storage } from "./app.js";

    let isAdmin = false;
    let userData = null;

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = "index.html"; return; }

      const snap = await getDoc(doc(db, "users", user.uid));
      userData = snap.data();
      isAdmin = userData?.role === 'admin';

      if (!isAdmin) {
        showToast('Доступ только для администратора', 'error', 3000);
        setTimeout(() => window.location.href = "feed.html", 1000);
        return; // <--- ВОТ ЗДЕСЬ
      }

            if (isAdmin) {
        const createBtn = document.getElementById('create-btn');
        if (createBtn) createBtn.style.display = 'inline-block';
      const createPostBtn = document.getElementById('create-post-btn');
        if (createPostBtn) createPostBtn.style.display = 'flex'; // или 'inline-block'
      }

      // === ВОТ СЮДА НУЖНО ВСТАВИТЬ ВЫЗОВ ===
      loadCategoriesForSelect();
      
    });

    window.publishPost = async () => {
      const title = document.getElementById('post-title').value.trim();
      const content = document.getElementById('post-content').innerHTML.trim();
      const isOpen = document.getElementById('post-open').checked;
      const errorDiv = document.getElementById('error');

      if (!title || !content) {
        errorDiv.innerText = 'Заполните заголовок и содержание';
        return;
      }
  try {
const categoryId = document.getElementById('post-category').value;

await addDoc(collection(db, "posts"), {
  title: title,
  content: content,
  isOpen: isOpen,
  categoryId: categoryId, // <-- НОВОЕ ПОЛЕ
  author: auth.currentUser.email,
  authorName: userData.name,
  createdAt: serverTimestamp()
});

    showToast('Пост опубликован', 'success', 1500);
    setTimeout(() => window.location.href = "feed.html?tab=posts", 800);

  } catch (error) {
    showToast('Ошибка: ' + error.message, 'error', 5000);
  }
    };

    window.execCmd = (cmd) => {
  document.execCommand(cmd, false, null);
  document.getElementById('post-content').focus();
};

window.uploadPostImage = async () => {
  const fileInput = document.getElementById('post-image-input');
  const file = fileInput.files[0];
  if (!file) return;

  showToast('Загрузка картинки...', 'info', 2000);
  
  const fileExtension = file.name.split('.').pop() || 'png';
  const fileName = `posts/${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExtension}`;
  const storageRef = ref(storage, fileName);
  
  try {
    await uploadBytes(storageRef, file);
    const downloadURL = await getDownloadURL(storageRef);

    const editor = document.getElementById('post-content');
    editor.focus();

    const img = document.createElement('img');
    img.src = downloadURL;
    img.style.maxWidth = '100%';
    img.style.margin = '10px 0';
    img.style.display = 'block';
    img.alt = 'uploaded image';

    const selection = window.getSelection();
    if (selection.rangeCount && editor.contains(selection.anchorNode)) {
      const range = selection.getRangeAt(0);
      range.deleteContents();
      range.insertNode(img);
      range.setStartAfter(img);
      range.setEndAfter(img);
      selection.removeAllRanges();
      selection.addRange(range);
    } else {
      editor.appendChild(img);
    }

    fileInput.value = ''; // Очищаем инпут для следующей загрузки
    showToast('Картинка вставлена!', 'success', 1500);
  } catch (error) {
    console.error("Ошибка загрузки:", error);
    showToast('Ошибка: ' + error.message, 'error', 5000);
  }
};
initFlowers();

async function loadCategoriesForSelect() {
  const select = document.getElementById('post-category');
  if (!select) return;

  select.innerHTML = '<option value="">Без категории</option>';

  try {
    // Убираем orderBy, чтобы не требовать индексы. Просто берем все категории.
    const snapshot = await getDocs(collection(db, "categories"));
    
    console.log("Загружено категорий:", snapshot.size); // Проверка в консоли

    snapshot.forEach((docSnap) => {
      const option = document.createElement('option');
      option.value = docSnap.id; 
      option.textContent = docSnap.data().name || "Без названия";
      select.appendChild(option);
    });
  } catch (error) {
    console.error("ОШИБКА ЗАГРУЗКИ КАТЕГОРИЙ:", error);
    showToast("Ошибка категорий: " + error.message, "error", 5000);
  }
}

document.getElementById('post-content').addEventListener('paste', async (e) => {
  const items = (e.clipboardData || window.clipboardData).items;
  let imageFile = null;

  // Ищем картинку в буфере
  for (const item of items) {
    if (item.kind === 'file' && item.type.startsWith('image/')) {
      imageFile = item.getAsFile();
      break;
    }
  }
  if (!imageFile && e.clipboardData.files.length > 0) {
    for (const file of e.clipboardData.files) {
      if (file.type.startsWith('image/')) {
        imageFile = file;
        break;
      }
    }
  }

  // Если нашли картинку (скриншот или из Excel)
  if (imageFile) {
    e.preventDefault();
    if (typeof showToast === 'function') showToast('Загрузка картинки из буфера...', 'info', 2000);
    
    try {
      let ext = 'png';
      if (imageFile.type.includes('jpeg')) ext = 'jpg';
      else if (imageFile.type.includes('gif')) ext = 'gif';
      else if (imageFile.type.includes('webp')) ext = 'webp';

      const fileName = `posts/pasted_${Date.now()}.${ext}`;
      const storageRef = ref(storage, fileName);
      
      await uploadBytes(storageRef, imageFile);
      const downloadURL = await getDownloadURL(storageRef);

      const editor = document.getElementById('post-content');
      const img = document.createElement('img');
      img.src = downloadURL;
      img.style.maxWidth = '100%';
      img.style.margin = '10px 0';
      img.style.display = 'block';
      img.alt = 'pasted image';

      const selection = window.getSelection();
      if (selection.rangeCount && editor.contains(selection.anchorNode)) {
        const range = selection.getRangeAt(0);
        range.deleteContents();
        range.insertNode(img);
        range.setStartAfter(img);
        range.setEndAfter(img);
        selection.removeAllRanges();
        selection.addRange(range);
      } else {
        editor.appendChild(img);
      }
      
      if (typeof showToast === 'function') showToast('Картинка вставлена!', 'success', 1500);
    } catch (error) {
      console.error("Ошибка загрузки:", error);
      if (typeof showToast === 'function') showToast('Ошибка: ' + error.message, 'error', 5000);
    }
    return; // Выходим, картинка обработана
  }

  // --- Обработка обычного текста ---
  const html = e.clipboardData.getData('text/html');
  const text = e.clipboardData.getData('text/plain');

  if (!html) {
    e.preventDefault();
    document.execCommand('insertText', false, text);
    return;
  }

  // Если скопировали текст с форматированием (жирный, курсив)
  e.preventDefault();
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');
  // Убираем лишние теги, оставляем только текст и базовое форматирование (опционально)
  document.execCommand('insertHTML', false, doc.body.innerHTML);
});

  </script>
</body>
</html>
