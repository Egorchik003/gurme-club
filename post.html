<!DOCTYPE html>
<html lang="ru">
<head>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta charset="UTF-8">
  <title>ГурмэКлаб — Просмотр поста</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <script type="module">
    import { renderSidebar, renderHeader } from "./components.js";
    renderHeader();
    renderSidebar('posts');
  </script>

<main class="main-content">
  <div style="max-width: 850px; margin: 0 auto;">
    <button class="secondary" onclick="location.href='feed.html'" style="margin-bottom: 20px; width: auto;">← Назад в ленту</button>
    <div id="post-detail-container">...</div>
  </div>
</main>

  <script type="module">
    import { auth, db } from "./app.js";
    import { showToast } from "./ui.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
    import { doc, getDoc, collection, query, orderBy, onSnapshot, addDoc, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    window.logout = () => signOut(auth);
    let currentUser, currentUserData, isAdmin, postId = new URLSearchParams(window.location.search).get('id');

    if (!postId) window.location.href = 'feed.html';

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = "index.html"; return; }
      currentUser = user;
      const userSnap = await getDoc(doc(db, "users", user.uid));
      currentUserData = userSnap.data() || { name: user.email, role: "user" };
      isAdmin = currentUserData.role === "admin";
      
      const numberHtml = currentUserData.number ? ` <span class="post-number">№${currentUserData.number}</span>` : '';
      document.getElementById('user-info').innerHTML = `${currentUserData.name}${numberHtml}` + (isAdmin ? ' <span class="badge admin">ADMIN</span>' : ' <span class="badge user">USER</span>');
      
      if (isAdmin) {
        const createBtn = document.getElementById('create-btn');
        if (createBtn) createBtn.style.display = 'inline-block';
      const createPostBtn = document.getElementById('create-post-btn');
        if (createPostBtn) createPostBtn.style.display = 'flex'; // или 'inline-block'
      }

      loadPost();
    });

    async function loadPost() {
      const container = document.getElementById('post-detail-container');
      try {
        const postSnap = await getDoc(doc(db, "posts", postId));
        if (!postSnap.exists()) return container.innerHTML = '<div class="card" style="color: var(--danger);">Пост не найден.</div>';
        const post = postSnap.data();
        if (!isAdmin && post.isOpen === false) return container.innerHTML = '<div class="card" style="color: var(--danger);">У вас нет доступа к этому посту.</div>';
        renderFullPost(postId, post, container);
      } catch (error) { container.innerHTML = '<div class="card" style="color: var(--danger);">Ошибка загрузки: ' + error.message + '</div>'; }
    }

    function renderFullPost(postId, post, container) {
      const div = document.createElement('div'); div.className = 'card';
      let adminButtons = isAdmin ? `
        <div class="post-actions">
          <button class="icon-btn" onclick="location.href='edit.html?id=${postId}'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg></button>
          <button class="icon-btn danger-icon" onclick="deletePost('${postId}')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>
        </div>` : '';

      div.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 20px;">
          <div style="flex-grow: 1;">
            <div><span class="post-author">${escapeHtml(post.authorName || post.author)}</span> ${post.isOpen === false ? '<span class="badge closed">ЗАКРЫТ</span>' : ''}</div>
            <div class="post-title" style="font-size: 28px; margin: 10px 0;">${escapeHtml(post.title)}</div>
          </div>${adminButtons}
        </div>
        <div class="post-content" style="font-size: 16px; line-height: 1.8;">${post.content}</div>
        <div class="post-time">${post.createdAt ? new Date(post.createdAt.seconds * 1000).toLocaleString() : ''}</div>
        <hr style="margin: 20px 0;">
        <h3 style="color: var(--gold-main); font-size: 18px; margin-bottom: 15px;">Комментарии</h3>
        <div id="comments-list-${postId}"></div>
        <div style="margin-top: 25px; display: flex; gap: 10px; align-items: stretch;">
          <input id="comment-input-${postId}" placeholder="Написать комментарий..." style="margin-bottom: 0; flex-grow: 1; background-color: var(--bg-input); border: 1px solid var(--navy-light); color: var(--text-main); padding: 12px 16px; border-radius: 8px; font-family: inherit; box-sizing: border-box;">
          <button onclick="addComment('${postId}')" style="width: auto; padding: 0 24px; margin: 0; white-space: nowrap;">Отправить</button>
        </div>
      `;
      container.innerHTML = ''; container.appendChild(div); loadComments(postId);
    }

    window.addComment = async (postId) => {
      const input = document.getElementById(`comment-input-${postId}`); const text = input.value.trim(); if (!text) return;
      const commentData = { author: currentUserData.name, text, createdAt: serverTimestamp(), avatarUrl: currentUserData.avatarUrl || '' };
      if (currentUserData.number) commentData.authorNumber = currentUserData.number;
      try { await addDoc(collection(db, "posts", postId, "comments"), commentData); input.value = ''; showToast('Комментарий добавлен', 'success', 2000); } catch (error) { showToast('Ошибка: ' + error.message, 'error', 5000); }
    };

    function loadComments(postId) {
      const commentsDiv = document.getElementById(`comments-list-${postId}`);

      commentsDiv.innerHTML = `
        <div class="skeleton-comment"></div>
        <div class="skeleton-comment"></div>
        <div class="skeleton-comment"></div>
      `;

      onSnapshot(query(collection(db, "posts", postId, "comments"), orderBy("createdAt", "asc")), (snapshot) => {
        commentsDiv.innerHTML = '';
        if (snapshot.empty) return commentsDiv.innerHTML = '<div style="color: var(--text-muted); font-size: 14px; padding: 10px 0;">Пока нет комментариев. Будьте первым!</div>';
        snapshot.forEach((docSnap) => {
          const c = docSnap.data(); const commentId = docSnap.id; const numHtml = c.authorNumber ? ` <span class="post-number">№${c.authorNumber}</span>` : '';
          const avatar = c.avatarUrl || 'data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%231c2b57\'><circle cx=\'12\' cy=\'12\' r=\'12\'/><path d=\'M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z\' fill=\'%23d4af37\'/></svg>';
          const cDiv = document.createElement('div'); cDiv.className = 'comment';
          cDiv.innerHTML = `
            <div style="display: flex; gap: 12px; align-items: flex-start;">
              <img src="${avatar}" loading="lazy" style="width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 1px solid var(--navy-light);">
              <div style="flex-grow: 1;"><div><strong>${escapeHtml(c.author)}</strong>${numHtml}: <span>${escapeHtml(c.text)}</span></div><div style="margin-top: 5px;"><a href="#" onclick="toggleReplyForm('${postId}', '${commentId}'); return false;" style="font-size: 12px;">Ответить</a></div></div>
            </div>
            <div id="reply-form-${commentId}" class="reply-form" style="display: none; margin-top: 10px; margin-left: 48px;">
              <input type="text" id="reply-input-${commentId}" placeholder="Ваш ответ..." style="font-size: 13px; padding: 8px;">
              <div style="display:flex; gap: 5px; justify-content: flex-end; margin-top: 5px;"><button class="secondary" onclick="toggleReplyForm('${postId}', '${commentId}')" style="width: auto; padding: 4px 10px; font-size: 11px;">Отмена</button><button onclick="submitReply('${postId}', '${commentId}')" style="width: auto; padding: 4px 10px; font-size: 11px;">Отправить</button></div>
            </div>
            <div id="replies-${commentId}" style="margin-left: 48px; margin-top: 8px;"></div>`;
          commentsDiv.appendChild(cDiv); loadReplies(postId, commentId);
        });
      });
    }

    window.toggleReplyForm = (postId, commentId) => {
      const form = document.getElementById(`reply-form-${commentId}`); const input = document.getElementById(`reply-input-${commentId}`); if (!form) return;
      if (form.style.display === 'none' || !form.style.display) { form.style.display = 'block'; input.focus(); } else { form.style.display = 'none'; input.value = ''; }
    };

    window.submitReply = async (postId, commentId) => {
      const input = document.getElementById(`reply-input-${commentId}`); const text = input.value.trim(); if (!text) return showToast('Введите текст ответа', 'info', 2000);
      const replyData = { author: currentUserData.name, text, createdAt: serverTimestamp(), avatarUrl: currentUserData.avatarUrl || '' };
      if (currentUserData.number) replyData.authorNumber = currentUserData.number;
      try { await addDoc(collection(db, "posts", postId, "comments", commentId, "replies"), replyData); input.value = ''; toggleReplyForm(postId, commentId); showToast('Ответ отправлен', 'success', 2000); } catch (error) { showToast('Ошибка: ' + error.message, 'error', 5000); }
    };

    function loadReplies(postId, commentId) {
      const repliesDiv = document.getElementById(`replies-${commentId}`); if (!repliesDiv) return;
      onSnapshot(query(collection(db, "posts", postId, "comments", commentId, "replies"), orderBy("createdAt", "asc")), (snapshot) => {
        repliesDiv.innerHTML = '';
        snapshot.forEach((docSnap) => {
          const r = docSnap.data(); const numHtml = r.authorNumber ? ` <span class="post-number">№${r.authorNumber}</span>` : '';
          const avatar = r.avatarUrl || 'data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%231c2b57\'><circle cx=\'12\' cy=\'12\' r=\'12\'/><path d=\'M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z\' fill=\'%23d4af37\'/></svg>';
          const rDiv = document.createElement('div'); rDiv.className = 'comment reply'; rDiv.style.cssText = 'display: flex; gap: 10px; align-items: flex-start;';
          rDiv.innerHTML = `<img src="${avatar}" loading="lazy" style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 1px solid var(--navy-light);"><div><strong>${escapeHtml(r.author)}</strong>${numHtml}: ${escapeHtml(r.text)}</div>`;
          repliesDiv.appendChild(rDiv);
        });
      });
    }

    window.deletePost = async (postId) => {
      if (!confirm('Удалить этот пост?')) return;
      try { await deleteDoc(doc(db, "posts", postId)); showToast('Пост удалён', 'success'); setTimeout(() => window.location.href = 'feed.html', 1000); } catch (error) { showToast('Ошибка: ' + error.message, 'error', 5000); }
    };

    function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, m => ({'&': '&amp;','<': '&lt;','>': '&gt;','"': '&quot;',"'": '&#39;'}[m])); }
        // Превращает ссылки в кликабельные
    function linkify(text) {
      // Регулярное выражение для поиска URL (http, https, www)
      const urlRegex = /(https?:\/\/[^\s]+|www\.[^\s]+)/g;
      return text.replace(urlRegex, function(url) {
        let href = url;
        if (url.startsWith('www.')) {
          href = 'https://' + url;
        }
        // Возвращаем ссылку, открывающуюся в новой вкладке
        return `<a href="${href}" target="_blank" rel="noopener noreferrer" style="color: var(--gold-main); text-decoration: underline;">${url}</a>`;
      });
    }
  </script>
</body>
</html>
